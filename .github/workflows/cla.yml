name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLA-Assistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant Check"
        uses: cla-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          # Dedicated, UNPROTECTED branch for the bot's own signature-file commits — `main`
          # has a branch-protection rule requiring PRs, which blocks the bot's direct push
          # (confirmed live: "Could not create file: Changes must be made through a pull
          # request"). This branch holds nothing else and never needs protecting.
          branch: 'cla-signatures'
          path-to-document: 'https://github.com/ekacin/UBLP/blob/main/CLA.md'
          allowlist: 'ekacin,bot-*'
