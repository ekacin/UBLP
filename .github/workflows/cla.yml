name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLA-Assistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant Check"
        uses: cla-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          # Dedicated, UNPROTECTED branch for the bot's own signature-file commits — `main`
          # has a branch-protection rule requiring PRs, which blocks the bot's direct push
          # (confirmed live: "Could not create file: Changes must be made through a pull
          # request"). This branch holds nothing else and never needs protecting.
          branch: 'cla-signatures'
          path-to-document: 'https://github.com/ekacin/UBLP/blob/main/CLA.md'
          allowlist: 'ekacin,bot-*'
          # The tool's default message buries the actual required action (a specific
          # comment, no link/button exists) inside a lot of boilerplate text — this puts it
          # first and makes it visually unmissable.
          custom-notsigned-prcomment: |
            ## 📝 Action required before this can be merged

            Please post the **exact line below** as a new comment on this pull request:

            ```
            I have read the CLA Document and I hereby sign the CLA
            ```

            There is no link or button to click — commenting that exact sentence is the
            signature. Full agreement: [CLA.md](https://github.com/ekacin/UBLP/blob/main/CLA.md)
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA.'
