name: UBLP CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'modules/zk-customs/**'
      - 'modules/incoterms-escrow/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'modules/zk-customs/**'
      - 'modules/incoterms-escrow/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'

env:
  NODE_VERSION: '22'
  RUST_VERSION: '1.81'
  COMPACT_VERSION: '0.31.1'
  # GitHub-hosted runners ship a pre-installed Rust toolchain, and the Compact
  # installer auto-detects $HOME/.cargo and installs there instead of
  # $HOME/.local/bin when that directory exists. Force it explicitly so the
  # path we add to GITHUB_PATH below always matches where the binary lands.
  COMPACT_INSTALL_DIR: /home/runner/.local/bin
  ZK_CUSTOMS_DIR: modules/zk-customs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Compact CLI
        run: |
          curl -sSLf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile Escrow contract
        run: |
          compact update ${{ env.COMPACT_VERSION }}
          npm run compile:contract -w @ublp/incoterms-escrow

      - name: Build all workspaces
        run: npm run build

  unit-tests:
    name: Unit Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared workspace
        run: npm run build:shared

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ${{ env.ZK_CUSTOMS_DIR }}/coverage
          flags: unit
          fail_ci_if_error: false

  integration-tests:
    name: Integration Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Compact CLI
        run: |
          curl -sSLf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile Escrow contract
        run: |
          compact update ${{ env.COMPACT_VERSION }}
          npm run compile:contract -w @ublp/incoterms-escrow

      - name: Build all workspaces
        run: npm run build

      - name: Run integration tests
        run: npm run test:integration -- --test-timeout=60000

  negative-tests:
    name: Negative / Security Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared workspace
        run: npm run build:shared

      - name: Run negative tests
        run: npm run test:negative

  incoterms-escrow-tests:
    name: Incoterms Escrow (Module 4) Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Compact CLI
        run: |
          curl -sSLf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile Escrow contract
        run: |
          compact update ${{ env.COMPACT_VERSION }}
          npm run compile:contract -w @ublp/incoterms-escrow

      - name: Build shared workspace
        run: npm run build:shared

      - name: Run incoterms-escrow tests
        run: npm run test:incoterms-escrow

  incoterms-escrow-e2e:
    name: Incoterms Escrow (Module 4) E2E — Local Devnet
    needs: incoterms-escrow-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Compact CLI
        run: |
          curl -sSLf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile Escrow contract
        run: |
          compact update ${{ env.COMPACT_VERSION }}
          npm run compile:contract -w @ublp/incoterms-escrow

      - name: Build all workspaces
        run: npm run build

      - name: Start local Midnight devnet
        run: npm run devnet:up -w @ublp/incoterms-escrow

      - name: Wait for devnet to be healthy
        run: |
          for i in $(seq 1 30); do
            ready=true
            for c in midnight-node midnight-indexer midnight-proof-server; do
              status=$(docker inspect --format='{{.State.Health.Status}}' "$c" 2>/dev/null || echo missing)
              [ "$status" = "healthy" ] || ready=false
            done
            if [ "$ready" = true ]; then echo "All services healthy"; exit 0; fi
            echo "Still waiting on devnet containers (attempt $i/30)..."
            sleep 10
          done
          docker compose -f modules/incoterms-escrow/scripts/devnet/standalone.yml logs
          echo "::error::Devnet did not become healthy in time"
          exit 1

      # full-lifecycle.ts self-funds the buyer's SHIELDED balance from the genesis wallet, but
      # assumes all three roles already have spendable DUST (unshielded NIGHT registered for
      # fee generation) to submit their own propose/lockEscrow/attestMilestone/claimPayout
      # transactions — see lifecycle-helpers.ts's fundUnshieldedAndRegisterDust doc comment for
      # why that's a separate concern from shielded funding. A brand-new CI devnet has neither,
      # so both must be provisioned here first.
      - name: Fund buyer/seller/port-authority wallets with NIGHT + DUST
        working-directory: modules/incoterms-escrow
        run: |
          npm run devnet:fund -- seller
          npm run devnet:fund -- buyer
          npm run devnet:fund -- port-authority

      - name: Run full escrow lifecycle against the real local devnet
        working-directory: modules/incoterms-escrow
        run: npm run e2e:devnet

      - name: Stop local Midnight devnet
        if: always()
        run: npm run devnet:down -w @ublp/incoterms-escrow

  # SP1 circuit build (Rust) — only if Rust files changed
  sp1-circuit:
    name: SP1 Circuit Build Check
    needs: lint-and-typecheck
    if: |
      github.event_name == 'pull_request' &&
      contains(join(github.event.pull_request.files.*.filename, ' '), 'sp1-circuit')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.ZK_CUSTOMS_DIR }}/sp1-circuit

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: riscv32im-succinct-zkvm-elf

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.ZK_CUSTOMS_DIR }}/sp1-circuit

      - name: Check compilation
        run: cargo check --release 2>&1 | head -50

  e2e-tests:
    name: End-to-End Tests
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Compact CLI
        run: |
          curl -sSLf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile Escrow contract
        run: |
          compact update ${{ env.COMPACT_VERSION }}
          npm run compile:contract -w @ublp/incoterms-escrow

      - name: Build all workspaces
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e -- --test-timeout=120000

  # Full E2E flow with actual services (requires service startup)
  full-flow:
    name: Full Service Flow Verification
    needs: e2e-tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Compact CLI
        run: |
          curl -sSLf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile Escrow contract
        run: |
          compact update ${{ env.COMPACT_VERSION }}
          npm run compile:contract -w @ublp/incoterms-escrow

      - name: Build all workspaces
        run: npm run build

      - name: Start services in background
        run: |
          npm run start:committee &
          npm run start:ministry &
          npm run start:agent &
          npm run start:l2 &
          echo "Waiting for services..."
          npx wait-on tcp:3004 tcp:3001 tcp:3002 tcp:3003 --timeout=60000
          echo "All services ready"
        timeout-minutes: 3

      - name: Run customs broker demo
        run: npm run run:broker
        timeout-minutes: 2

      - name: Fetch settled records
        run: |
          curl -s http://localhost:3003/api/records | head -50
          echo ""
          echo "Flow completed successfully"

      - name: Stop services
        if: always()
        run: |
          pkill -f "node dist/index.js" || true
